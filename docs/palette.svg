<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Portfolio brand palette">
  <title>Mauricio Zaffari — Palette</title>
  <desc>Two-ink letterpress system: warm paper stock, one ink ramp, and one rationed accent hue. Contrast ratios are WCAG 2.1 relative luminance against Paper #FBF9F5.</desc>
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Noto Sans", sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", "Liberation Mono", monospace; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
      .sub { font-size: 15px; }
      .sec { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .name { font-size: 15px; font-weight: 600; }
      .hex { font-size: 13px; }
      .note { font-size: 12px; }
      .ratio { font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#FBF9F5"/>

  <text class="t title" x="64" y="70" fill="#141210">Mauricio Zaffari — brand palette</text>
  <text class="t sub" x="64" y="100" fill="#5C554A">Two-ink letterpress system: warm paper stock, disciplined ink ramp, and one rationed accent hue.</text>

  <!-- Top Swatches: Core Inks & Accent -->
  <text class="m sec" x="64" y="145" fill="#736B61">PRIMARY STOPS &amp; ACCENT</text>
  <g>
    <!-- Paper -->
    <rect x="64" y="160" width="200" height="120" fill="#FBF9F5" stroke="#C7BFB0" stroke-width="1"/>
    <text class="t name" x="64" y="304" fill="#141210">Paper</text>
    <text class="m hex" x="64" y="324" fill="#736B61">#FBF9F5</text>
    <text class="t note" x="64" y="344" fill="#5C554A">the only surface</text>

    <!-- Ink -->
    <rect x="288" y="160" width="200" height="120" fill="#141210"/>
    <text class="t name" x="288" y="304" fill="#141210">Ink</text>
    <text class="m hex" x="288" y="324" fill="#736B61">#141210</text>
    <text class="t note" x="288" y="344" fill="#5C554A">headings, mark glyph</text>

    <!-- Ink Body -->
    <rect x="512" y="160" width="200" height="120" fill="#2E2A25"/>
    <text class="t name" x="512" y="304" fill="#141210">Ink Body</text>
    <text class="m hex" x="512" y="324" fill="#736B61">#2E2A25</text>
    <text class="t note" x="512" y="344" fill="#5C554A">body prose, roles</text>

    <!-- Accent -->
    <rect x="736" y="160" width="200" height="120" fill="#B03A1A"/>
    <text class="t name" x="736" y="304" fill="#141210">Accent</text>
    <text class="m hex" x="736" y="324" fill="#736B61">#B03A1A</text>
    <text class="t note" x="736" y="344" fill="#5C554A">mark rule, focus, links</text>

    <!-- Accent Deep -->
    <rect x="960" y="160" width="176" height="120" fill="#8A2C12"/>
    <text class="t name" x="960" y="304" fill="#141210">Accent Deep</text>
    <text class="m hex" x="960" y="324" fill="#736B61">#8A2C12</text>
    <text class="t note" x="960" y="344" fill="#5C554A">link hover and active</text>
  </g>

  <!-- Secondary Swatches -->
  <text class="m sec" x="64" y="390" fill="#736B61">SECONDARY INKS &amp; RULES</text>
  <g>
    <!-- Ink Muted -->
    <rect x="64" y="405" width="200" height="80" fill="#5C554A"/>
    <text class="t name" x="64" y="508" fill="#141210">Ink Muted</text>
    <text class="m hex" x="64" y="526" fill="#736B61">#5C554A</text>
    <text class="t note" x="64" y="544" fill="#5C554A">secondary prose, captions</text>

    <!-- Ink Faint -->
    <rect x="288" y="405" width="200" height="80" fill="#736B61"/>
    <text class="t name" x="288" y="508" fill="#141210">Ink Faint</text>
    <text class="m hex" x="288" y="526" fill="#736B61">#736B61</text>
    <text class="t note" x="288" y="544" fill="#5C554A">mono gutter, ordinals</text>

    <!-- Rule Strong -->
    <rect x="512" y="405" width="200" height="80" fill="#C7BFB0"/>
    <text class="t name" x="512" y="508" fill="#141210">Rule Strong</text>
    <text class="m hex" x="512" y="526" fill="#736B61">#C7BFB0</text>
    <text class="t note" x="512" y="544" fill="#5C554A">section boundaries</text>

    <!-- Rule -->
    <rect x="736" y="405" width="200" height="80" fill="#E5DFD3"/>
    <text class="t name" x="736" y="508" fill="#141210">Rule</text>
    <text class="m hex" x="736" y="526" fill="#736B61">#E5DFD3</text>
    <text class="t note" x="736" y="544" fill="#5C554A">row hairlines</text>

    <!-- Paper Select -->
    <rect x="960" y="405" width="176" height="80" fill="#F3DED5" stroke="#C7BFB0" stroke-width="1"/>
    <text class="t name" x="960" y="508" fill="#141210">Paper Select</text>
    <text class="m hex" x="960" y="526" fill="#736B61">#F3DED5</text>
    <text class="t note" x="960" y="544" fill="#5C554A">selection highlight</text>
  </g>

  <!-- Contrast Ratios on Paper -->
  <text class="m sec" x="64" y="590" fill="#736B61">MEASURED CONTRAST ON PAPER #FBF9F5 (WCAG 2.1)</text>
  <g>
    <rect x="64" y="605" width="165" height="50" fill="#141210"/>
    <text class="t ratio" x="146" y="636" fill="#FBF9F5" text-anchor="middle">17.8:1 AAA</text>

    <rect x="253" y="605" width="165" height="50" fill="#2E2A25"/>
    <text class="t ratio" x="335" y="636" fill="#FBF9F5" text-anchor="middle">13.5:1 AAA</text>

    <rect x="442" y="605" width="165" height="50" fill="#5C554A"/>
    <text class="t ratio" x="524" y="636" fill="#FBF9F5" text-anchor="middle">7.0:1 AAA</text>

    <rect x="631" y="605" width="165" height="50" fill="#736B61"/>
    <text class="t ratio" x="713" y="636" fill="#FBF9F5" text-anchor="middle">5.0:1 AA</text>

    <rect x="820" y="605" width="165" height="50" fill="#B03A1A"/>
    <text class="t ratio" x="902" y="636" fill="#FBF9F5" text-anchor="middle">5.8:1 AA</text>

    <rect x="1009" y="605" width="127" height="50" fill="#8A2C12"/>
    <text class="t ratio" x="1072" y="636" fill="#FBF9F5" text-anchor="middle">8.2:1 AAA</text>
  </g>

  <!-- Contrast Ratios on Ink -->
  <text class="m sec" x="64" y="695" fill="#736B61">MEASURED CONTRAST ON INK #141210 (DARK CONTEXTS)</text>
  <g>
    <rect x="64" y="710" width="200" height="44" fill="#FBF9F5" stroke="#C7BFB0" stroke-width="1"/>
    <text class="t ratio" x="164" y="737" fill="#141210" text-anchor="middle">Paper 17.8:1 AAA</text>

    <rect x="288" y="710" width="200" height="44" fill="#B03A1A"/>
    <text class="t ratio" x="388" y="737" fill="#FBF9F5" text-anchor="middle">Accent 3.1:1 Graphic</text>

    <rect x="512" y="710" width="200" height="44" fill="#C7BFB0"/>
    <text class="t ratio" x="612" y="737" fill="#141210" text-anchor="middle">Rule Strong 10.2:1</text>
  </g>

  <text class="t note" x="64" y="795" fill="#736B61">Color scheme is strictly light. Every text pair clears WCAG AA; body prose and headings clear AAA.</text>
  <text class="t note" x="64" y="815" fill="#736B61">The second ink #B03A1A is rationed to interactive states and the grounding bar of the monogram.</text>
</svg>
