# Interface chrome only — the Portuguese counterpart of en.yml. See that file
# for why content never appears here.
#
# Chrome and records are both Portuguese now, so /pt-BR substitutes nothing.
# The split still matters: chrome lives here because it has no counterpart in
# data/, and a label sourced from a record cannot carry the marker that makes a
# substitution legible. If an English record is ever authored ahead of its
# translation, the fallback marks that entry and this frame stays Portuguese.
pt-BR:
  date:
    formats:
      default: "%d/%m/%Y"
      day_month_year: "%-d de %B de %Y"
      month_year: "%B de %Y"
      long: "%-d de %B de %Y"
      short: "%d de %B"
    day_names:
      - domingo
      - segunda-feira
      - terça-feira
      - quarta-feira
      - quinta-feira
      - sexta-feira
      - sábado
    abbr_day_names:
      - dom
      - seg
      - ter
      - qua
      - qui
      - sex
      - sáb
    month_names:
      -
      - janeiro
      - fevereiro
      - março
      - abril
      - maio
      - junho
      - julho
      - agosto
      - setembro
      - outubro
      - novembro
      - dezembro
    abbr_month_names:
      -
      - jan
      - fev
      - mar
      - abr
      - mai
      - jun
      - jul
      - ago
      - set
      - out
      - nov
      - dez

  number:
    format:
      delimiter: "."
      separator: ","
      precision: 2

  metadata:
    image_alt: "Um cartão tipográfico com %{name}, %{headline}."
    faq:
      role:
        question: "O que Mauricio Zaffari faz?"
      work:
